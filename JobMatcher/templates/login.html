{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- guide ai icon -->
    <link rel="icon" type="image/png" href="{% static 'icons/guide ai.png' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery and jQuery Validate (CDN for reliability) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

    <!-- style for login page -->
    <link rel="stylesheet" href="#">

    <!-- Bootstrap Bundle (JS) -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

    <title>Login</title>

</head>

<body>
    <div class="container">
        <fieldset class="border p-4">
            <legend class="fw-bold text-center">Login</legend>

            <form action="{% url 'loginaction' %}" method="POST" id="form">
                 {% csrf_token %}
                <h2 class="text-primary text-center">Guide AI</h2>

                <div class="mb-3">
                    <label>Email:</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label>Password:</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-primary">Sign In</button>

                <!-- Forgot Password Link -->
                <a href="#" class="forgot-password">Forgot password?</a>
                <br><br>
                <center>Dont't have an account?<a href="{% url 'signup' %}" class="fw-bold text-center">Sign UP</a>
                </center>

            </form>
        </fieldset>
    </div>


    <script>
        $(document).ready(function () {
            $("#form").validate({
                rules: {
                    gmail: {
                        required: true,
                        email: true
                    },
                    pass: {
                        required: true,
                        minlength: 6
                    }
                },
                messages: {
                    gmail: {
                        required: "This field is required",
                        email: "Enter a valid email address"
                    },
                    pass: {
                        required: "You must enter a password",
                        minlength: "Password must be at least 6 characters"
                    }
                }
            });
        });
    </script>

    <style>
       body {
    background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
        url('{% static 'images/bg4.gif' %}') center/cover no-repeat;
    background-blend-mode: difference;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}


.container {
    max-width: 400px;
    background-color: #111;
    /* Slightly lighter black for contrast */
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    /* Subtle white glow */
}

label {
    font-weight: bold;
}

.form-control {
    background-color: #222;
    /* Dark input background */
    color: #fff;
    /* White text */
    border: 1px solid #555;
    /* Light gray border */
}

.form-control:focus {
    background-color: #222 !important;
    /* Keep same background color when focused */
    color: #fff;
    /* Keep text white */
    border-color: #0d6efd;
    /* Bootstrap primary blue */
    box-shadow: 0 0 5px rgba(13, 110, 253, 0.5);
}

.form-control::placeholder {
    color: #aaa;
    /* Light gray placeholder text */
    opacity: 0.7;
}


.btn-primary {
    transition: color 0.3s ease-in-out;
}

.btn-primary:hover {
    color: #007bff !important;
    /* Change color on hover (example: yellow) */
    text-decoration: underline;
    /* Optional: add an underline */
    transition: font-size 0.3s ease-in-out;
    font-size: 20px;
}

label.error {
    color: red;
    font-size: 14px;
    display: block;
    margin-top: 5px;
}

.forgot-password {
    display: block;
    text-align: center;
    margin-top: 15px;
    color: #0d6efd;
    text-decoration: none;
}

.forgot-password:hover {
    color: #0056b3;
    text-decoration: underline;
}

/* Mobile Responsive Styles */
@media (max-width: 768px) {
    body {
        padding: 20px 10px;
        height: auto;
        min-height: 100vh;
    }
    
    .container {
        max-width: 100%;
        margin: 0 auto;
        padding: 20px 15px;
        border-radius: 15px;
    }
    
    fieldset {
        border: none !important;
        padding: 0 !important;
    }
    
    legend {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
    }
    
    h2.text-primary {
        font-size: 1.8rem;
        margin-bottom: 2rem;
    }
    
    .form-control {
        padding: 12px 15px;
        font-size: 16px;
        border-radius: 8px;
        margin-bottom: 1rem;
    }
    
    label {
        font-size: 14px;
        margin-bottom: 0.5rem;
        display: block;
    }
    
    .btn-primary {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        margin-top: 1rem;
    }
    
    .btn-primary:hover {
        font-size: 16px;
        text-decoration: none;
    }
    
    .forgot-password {
        display: block;
        text-align: center;
        margin-top: 1rem;
        font-size: 14px;
    }
    
    center {
        margin-top: 1.5rem;
    }
    
    center a {
        font-size: 14px;
    }
    
    label.error {
        font-size: 12px;
        margin-top: 0.25rem;
        margin-bottom: 0.5rem;
    }
}

@media (max-width: 576px) {
    body {
        padding: 10px 5px;
    }
    
    .container {
        padding: 15px 10px;
        margin: 10px 5px;
    }
    
    h2.text-primary {
        font-size: 1.5rem;
    }
    
    legend {
        font-size: 1.3rem;
    }
    
    .form-control {
        padding: 10px 12px;
        font-size: 15px;
    }
    
    .btn-primary {
        padding: 10px;
        font-size: 15px;
    }
}

@media (max-width: 400px) {
    .container {
        padding: 10px 8px;
        margin: 5px 2px;
    }
    
    h2.text-primary {
        font-size: 1.3rem;
    }
    
    legend {
        font-size: 1.2rem;
    }
    
    .form-control {
        padding: 8px 10px;
        font-size: 14px;
    }
    
    .btn-primary {
        padding: 8px;
        font-size: 14px;
    }
    
    label {
        font-size: 13px;
    }
    
    .forgot-password {
        font-size: 12px;
    }
    
    center a {
        font-size: 12px;
    }
}

/* Touch-friendly adjustments */
@media (hover: none) and (pointer: coarse) {
    .btn-primary {
        min-height: 48px;
        font-size: 16px;
    }
    
    .form-control {
        min-height: 44px;
        font-size: 16px;
    }
    
    .forgot-password {
        padding: 10px 0;
    }
}

/* Landscape mobile */
@media (max-width: 768px) and (orientation: landscape) {
    body {
        padding: 10px;
    }
    
    .container {
        margin: 10px auto;
        max-width: 500px;
    }
    
    h2.text-primary {
        font-size: 1.4rem;
        margin-bottom: 1rem;
    }
    
    .btn-primary {
        margin-top: 0.5rem;
    }
}

    </style>

</body>

</html>
