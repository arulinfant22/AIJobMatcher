{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matching Jobs from Google</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS (optional for styling) -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h3 {
            color: #343a40;
            margin-bottom: 30px;
        }

        ul.job-list {
            list-style-type: none;
            padding: 0;
        }

        ul.job-list li {
            background-color: #fff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        ul.job-list li a {
            font-weight: bold;
            font-size: 18px;
            color: #007bff;
            text-decoration: none;
        }

        ul.job-list li a:hover {
            text-decoration: underline;
        }

        small {
            display: block;
            margin-top: 8px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>🔍 Matching Jobs from Google</h3>

        {% if jobs %}
            <ul class="job-list">
                {% for job in jobs %}
                    <li>
                        <a href="{{ job.link }}" target="_blank">{{ job.title }}</a>
                        <small>{{ job.snippet }}</small>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No matching jobs found at this time.</p>
        {% endif %}
    </div>

</body>
</html>
